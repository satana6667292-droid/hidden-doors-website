# Final HTTPS config for hidden-doors.ru.
# Enable only after the certificate exists:
# /etc/letsencrypt/live/hidden-doors.ru/fullchain.pem
# /etc/letsencrypt/live/hidden-doors.ru/privkey.pem
#
# Expected document root:
# /srv/hidden-doors/current -> /srv/hidden-doors/releases/<git-sha>

server {
    listen 80;
    listen [::]:80;

    server_name hidden-doors.ru www.hidden-doors.ru;

    root /srv/hidden-doors/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://hidden-doors.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.hidden-doors.ru;

    ssl_certificate     /etc/letsencrypt/live/hidden-doors.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hidden-doors.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hidden-doors.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hidden-doors.ru;

    ssl_certificate     /etc/letsencrypt/live/hidden-doors.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hidden-doors.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/hidden-doors/current;
    index index.html;

    access_log /var/log/nginx/hidden-doors.access.log;
    error_log  /var/log/nginx/hidden-doors.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /hiddendoors {
        return 301 /hidden-doors/;
    }

    location = /hiddendoors/ {
        return 301 /hidden-doors/;
    }

    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
