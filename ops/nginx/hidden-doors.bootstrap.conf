# Bootstrap HTTP-only config for hidden-doors.ru.
# Safe to enable before DNS cutover: it does not reference TLS certificate files.
#
# Expected document root:
# /srv/hidden-doors/current -> /srv/hidden-doors/releases/<git-sha>

server {
    listen 80;
    listen [::]:80;

    server_name hidden-doors.ru www.hidden-doors.ru;

    root /srv/hidden-doors/current;
    index index.html;

    access_log /var/log/nginx/hidden-doors.access.log;
    error_log  /var/log/nginx/hidden-doors.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /hiddendoors {
        return 301 /hidden-doors/;
    }

    location = /hiddendoors/ {
        return 301 /hidden-doors/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
