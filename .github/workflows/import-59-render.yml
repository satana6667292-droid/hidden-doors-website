name: Import 59mm card render

on:
  push:
    branches:
      - preview-site
    paths:
      - '.github/workflows/import-59-render.yml'

permissions:
  contents: write

jobs:
  import-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5
        with:
          ref: preview-site
          fetch-depth: 1

      - name: Rebuild approved 59mm render
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/door59.part0 .tmp/door59.part1 .tmp/door59.part2 .tmp/door59.part3 > /tmp/door59.b64
          base64 -d /tmp/door59.b64 > site/assets/door-59-interior.webp
          test -s site/assets/door-59-interior.webp

          python - <<'PY'
          from pathlib import Path

          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')

          old='src="assets/scene1.webp" loading="lazy" alt="Скрытая дверь Hidden Doors 59 мм на алюминиевом каркасе в тёмном интерьере"'
          new='src="assets/door-59-interior.webp?v=20261001-59mm1" loading="lazy" alt="Высокая скрытая дверь Hidden Doors 59 мм до потолка в современном интерьере"'

          if old not in s:
              raise SystemExit('59 mm homepage card image reference not found')

          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          rm -f .tmp/door59.part0 .tmp/door59.part1 .tmp/door59.part2 .tmp/door59.part3
          rm -f .github/workflows/import-59-render.yml

      - name: Commit preview image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preview: replace 59mm card image with tall door render"
          git push origin HEAD:preview-site
