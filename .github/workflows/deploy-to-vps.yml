name: Deploy Hidden Doors to VPS (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish the current ref to the production VPS'
        required: true
        default: 'PREPARE'

permissions:
  contents: read

concurrency:
  group: hidden-doors-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate production website
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/404.html

          grep -Fq 'https://hidden-doors.ru/sitemap.xml' site/robots.txt
          grep -Fq 'https://hidden-doors.ru/' site/sitemap.xml

          if grep -RIlE 'chatgpt\.site|satana6667292-droid\.github\.io' site             --include='*.html' --include='*.js' --include='*.css' --include='*.xml' --include='*.txt'; then
            echo 'Preview/GitHub Pages URL found inside production site.'
            exit 1
          fi

          html_count="$(find site -type f -name '*.html' | wc -l)"
          file_count="$(find site -type f | wc -l)"
          echo "Validated: ${html_count} HTML files, ${file_count} total files."

      - name: Prepare server payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          rsync -a             --exclude='CNAME'             --exclude='.nojekyll'             site/ .deploy/

          test -s .deploy/index.html
          test ! -e .deploy/CNAME
          test ! -e .deploy/.nojekyll

      - name: Configure pinned SSH host key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload immutable release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"

          SSH_PORT="${SSH_PORT:-22}"
          RELEASE_DIR="/srv/hidden-doors/releases/${GITHUB_SHA}"

          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}"             "mkdir -p '${RELEASE_DIR}'"

          rsync -az --delete             -e "ssh -p ${SSH_PORT}"             .deploy/ "${SSH_USER}@${SSH_HOST}:${RELEASE_DIR}/"

      - name: Activate release atomically
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          RELEASE_DIR="/srv/hidden-doors/releases/${GITHUB_SHA}"

          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
            set -eu
            test -s '${RELEASE_DIR}/index.html'
            ln -sfn '${RELEASE_DIR}' /srv/hidden-doors/current.next
            mv -Tf /srv/hidden-doors/current.next /srv/hidden-doors/current
            test -s /srv/hidden-doors/current/index.html

            cd /srv/hidden-doors/releases
            ls -1dt -- */ 2>/dev/null | tail -n +6 | xargs -r rm -rf --
          "

      - name: Optional public health check
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            curl --fail --silent --show-error --location               --max-time 20 --retry 3 --retry-delay 2               "${HEALTHCHECK_URL}" >/dev/null
            echo "Public health check passed: ${HEALTHCHECK_URL}"
          else
            echo "PROD_HEALTHCHECK_URL is not set; public health check skipped."
          fi
