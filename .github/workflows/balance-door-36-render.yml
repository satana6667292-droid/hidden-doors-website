name: Restore balanced 36mm card render

on:
  push:
    branches:
      - preview-site
    paths:
      - '.github/workflows/balance-door-36-render.yml'

permissions:
  contents: write

jobs:
  update-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v5
        with:
          ref: preview-site

      - name: Build balanced card asset
        shell: bash
        env:
          SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/df152da9-6d04-4858-843f-c48603b203a8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTZhZjRiZjE4OTU5MzY2NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk4Mjg5N30.Fb9fzbBZ5f2VhxaqAKvN_-QlC3vJuQ9XInDjwRO-ahQ'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_URL" -o /tmp/door-36-source.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open('/tmp/door-36-source.png').convert('RGB')

          # Keep the full interior composition. CSS cover will do only the small
          # amount of crop needed to match the card ratio.
          target_width = 1200
          target_height = round(src.height * target_width / src.width)
          out_img = src.resize((target_width, target_height), Image.Resampling.LANCZOS)

          out = Path('site/assets/door-36-interior.webp')
          out_img.save(out, 'WEBP', quality=82, method=6)
          print(out, out_img.size, out.stat().st_size)
          PY

      - name: Commit updated render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/door-36-interior.webp
          git commit -m "Preview: rebalance 36mm card image framing"
          git push origin HEAD:preview-site
