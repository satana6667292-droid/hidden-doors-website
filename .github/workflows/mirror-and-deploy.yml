name: Mirror and deploy current Hidden Doors website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mirror current published site once
        if: ${{ hashFiles('site/index.html') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://hidden-doors-corporate.mafr83749.chatgpt.site/"
          HOST="hidden-doors-corporate.mafr83749.chatgpt.site"

          rm -rf .mirror site
          mkdir -p .mirror site

          wget \
            --recursive \
            --level=10 \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36" \
            --directory-prefix=.mirror \
            "$SOURCE"

          test -d ".mirror/$HOST"
          cp -a ".mirror/$HOST/." site/
          rm -rf .mirror

          touch site/.nojekyll
          test -s site/index.html

      - name: Store mirrored website in the repository
        if: ${{ hashFiles('site/index.html') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "chore: import current published site [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify mirrored website
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          echo "Mirrored files: $(find site -type f | wc -l)"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
