name: Mirror and deploy current Hidden Doors website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mirror current published site once
        if: ${{ hashFiles('site/index.html') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://hidden-doors-corporate.mafr83749.chatgpt.site/"
          HOST="hidden-doors-corporate.mafr83749.chatgpt.site"

          rm -rf .mirror site
          mkdir -p .mirror site

          wget \
            --recursive \
            --level=10 \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36" \
            --directory-prefix=.mirror \
            "$SOURCE"

          test -d ".mirror/$HOST"
          cp -a ".mirror/$HOST/." site/
          rm -rf .mirror

          touch site/.nojekyll
          test -s site/index.html

      - name: Apply prelaunch legal cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('site')
          for p in root.rglob('*.html'):
              if p.as_posix() in {'site/privacy/index.html','site/consent/index.html'}:
                  continue
              s=p.read_text(encoding='utf-8')
              rel=p.relative_to(root)
              depth=len(rel.parts)-1
              prefix='./' if depth==0 else '../'*depth

              s=re.sub(
                  r'<button class="([^"]+)" data-dialog="account">Кабинет дилера <span(?: aria-hidden="true")?>↗</span></button>',
                  r'<a class="\1" href="https://lk.hidden-doors.ru/" target="_blank" rel="noopener noreferrer">Кабинет дилера <span aria-hidden="true">↗</span></a>',
                  s
              )
              s=s.replace('<div class="prototype-note">Предпросмотр формы. Данные никуда не отправляются.</div>','')
              s=s.replace('<p>Дилерский кабинет предусмотрен для работы с продуктом и заказами. Доступ подключается партнёрам по мере запуска функционала.</p>','<p>Дилерский кабинет для работы с продуктом и заказами.</p>')
              s=s.replace(
                  '<button class="button green" type="submit">Проверить заявку <span>↗</span></button>',
                  '<button class="button green" type="submit">Отправить заявку <span>↗</span></button>'
              )
              s=re.sub(r'<dialog id="account-dialog"[\s\S]*?</dialog>','',s)
              s=re.sub(r'app\.js\?v=[^"\'\s<]+','app.js?v=20260929-legal1',s)
              s=re.sub(r'style\.css\?v=[^"\'\s<]+','style.css?v=20260929-legal1',s)
              preview_base='https://satana6667292-droid.github.io/hidden-doors-website'
              prod_base='https://hidden-doors.ru'
              s=s.replace(preview_base,prod_base)
              s=s.replace('<label>Ваше имя<input name="name"', '<label>Ваше имя *<input name="name"')
              s=s.replace('<label>Телефон<input name="phone"', '<label>Телефон *<input name="phone"')
              s=s.replace('<label>Город<input name="city" autocomplete="address-level2" required', '<label>Город<input name="city" autocomplete="address-level2"')
              s=re.sub(
                  r'<div class="wrap footer-bottom"><span>© 2026 Hidden Doors</span><span>[\s\S]*?</span><a href="#top">',
                  f'<div class="wrap footer-bottom"><span>© 2026 Hidden Doors</span><span><a href="{prefix}privacy/">Политика ПД</a> · <a href="{prefix}consent/">Согласие на обработку ПД</a></span><a href="#top">',
                  s
              )
              p.write_text(s,encoding='utf-8')

          bad=[]
          for p in root.rglob('*.html'):
              if p.as_posix() in {'site/privacy/index.html','site/consent/index.html'}:
                  continue
              s=p.read_text(encoding='utf-8')
              for token in ('формы без отправки','Предпросмотр формы. Данные никуда не отправляются.','id="account-dialog"','data-dialog="account"'):
                  if token in s:
                      bad.append(f'{p}: {token}')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY

      - name: Store mirrored website in the repository
        if: ${{ hashFiles('site/index.html') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "chore: import current published site [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify mirrored website
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          echo "Mirrored files: $(find site -type f | wc -l)"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Verify published form and Yandex Metrika
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          html="$(curl --fail --silent --show-error --max-time 20 "$base/")"
          app="$(curl --fail --silent --show-error --max-time 20 "$base/app.js?v=20260929-leads1")"

          grep -Fq "const METRIKA_ID=95250042;" <<<"$app"
          grep -Fq "ym(METRIKA_ID,'init'" <<<"$app"
          grep -Fq "metricGoal('lead_success'" <<<"$app"
          grep -Fq "subscriberDigits.length!==10" <<<"$app"
          grep -Fq "name.required=true" <<<"$app"
          grep -Fq "city.required=false" <<<"$app"
          ! grep -Fq "project_file" <<<"$app"

          curl --fail --silent --show-error --max-time 20             "https://mc.yandex.ru/metrika/tag.js?id=95250042"             -o /tmp/yandex-metrika-tag.js
          test -s /tmp/yandex-metrika-tag.js

          echo "Published form + Yandex Metrika verification passed"
