name: Tighten 36mm card render

on:
  push:
    branches:
      - preview-site
    paths:
      - '.github/workflows/tighten-door-36-render.yml'

permissions:
  contents: write

jobs:
  update-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v5
        with:
          ref: preview-site

      - name: Crop render for card
        shell: bash
        env:
          SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/df152da9-6d04-4858-843f-c48603b203a8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTZhZjRiZjE4OTU5MzY2NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk4Mjg5N30.Fb9fzbBZ5f2VhxaqAKvN_-QlC3vJuQ9XInDjwRO-ahQ'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_URL" -o /tmp/door-36-source.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open('/tmp/door-36-source.png').convert('RGB')

          # Tighter 4:3 composition: larger door, less empty space.
          crop = src.crop((124, 130, 1324, 1030))
          crop = crop.resize((900, 675), Image.Resampling.LANCZOS)

          out = Path('site/assets/door-36-interior.webp')
          crop.save(out, 'WEBP', quality=82, method=6)
          print(out, crop.size, out.stat().st_size)
          PY

      - name: Commit updated render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/door-36-interior.webp
          git commit -m "Preview: tighten 36mm card image crop"
          git push origin HEAD:preview-site
