name: Import 36mm interior render

on:
  push:
    branches:
      - preview-site
    paths:
      - '.github/workflows/import-door-render.yml'

permissions:
  contents: write

jobs:
  import-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5
        with:
          ref: preview-site

      - name: Download and optimize render
        shell: bash
        env:
          SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/df152da9-6d04-4858-843f-c48603b203a8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTZhZjRiZjE4OTU5MzY2NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk4Mjg5N30.Fb9fzbBZ5f2VhxaqAKvN_-QlC3vJuQ9XInDjwRO-ahQ'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_URL" -o /tmp/door-36-interior.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src=Path('/tmp/door-36-interior.png')
          dst=Path('site/assets/door-36-interior.webp')

          im=Image.open(src).convert('RGB')
          target_width=900
          target_height=round(im.height*target_width/im.width)
          im=im.resize((target_width,target_height),Image.Resampling.LANCZOS)
          im.save(dst,'WEBP',quality=76,method=6)

          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          old='src="assets/door-36.webp"'
          new='src="assets/door-36-interior.webp"'
          if old not in s:
              raise SystemExit('36 mm homepage image reference not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          ls -lh site/assets/door-36-interior.webp
          grep -F 'assets/door-36-interior.webp' site/index.html

      - name: Commit preview render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/assets/door-36-interior.webp
          git commit -m "Preview: add 36mm interior render"
          git push origin HEAD:preview-site
