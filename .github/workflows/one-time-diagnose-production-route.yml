name: One-time verify public production HTML

on:
  push:
    branches:
      - ops/promote-approved-preview-2026-10-03

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, hidden-doors-website]
    timeout-minutes: 5
    steps:
      - name: Inspect live HTML
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp)
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://hidden-doors.ru/?check=$(date +%s)" -o "$TMP"
          echo "=== HERO MARKERS ==="
          grep -nE 'hero-slider|от производителя — под ваш интерьер|Стать дилером|Скрытые двери без наличников' "$TMP" | head -30 || true
          echo "=== HTML SHA256 ==="
          sha256sum "$TMP"
          rm -f "$TMP"
