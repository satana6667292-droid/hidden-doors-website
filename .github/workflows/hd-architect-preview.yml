name: HD Architect widget preview

on:
  push:
    branches:
      - feature/hd-architect-widget-mvp-2026-10-07

permissions:
  contents: read

concurrency:
  group: hidden-doors-hd-architect-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: [self-hosted, Linux, X64, hidden-doors-website]
    timeout-minutes: 30
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5

      - name: Validate preview source
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/hd-architect-widget.js
          test -s site/hd-architect-widget.css
          grep -Fq 'hd-architect-widget.js' site/index.html
          grep -Fq 'hd-architect-widget.css' site/index.html
          bash -n ops/hidden-doors-website-root.sh

      - name: Deploy preview
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sudo -n /usr/local/sbin/hidden-doors-website deploy-preview "$GITHUB_WORKSPACE" "$SHA"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## HD Architect preview"
            echo
            echo "Preview: https://hidden-doors-site.138.124.69.108.sslip.io/"
            echo "Branch: feature/hd-architect-widget-mvp-2026-10-07"
          } >> "$GITHUB_STEP_SUMMARY"
